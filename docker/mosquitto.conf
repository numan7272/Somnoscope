# ============================================================================
# Mosquitto-Konfiguration für Somnoscope (lokales Homelab)
# ============================================================================
# Mosquitto 2.x akzeptiert ohne explizite Konfiguration NUR localhost-
# Verbindungen. Damit der ESP32 aus dem LAN und die App-Container aus dem
# Compose-Netz publishen/subscriben können, brauchen wir einen Listener.
#
# Sicherheits-Hinweis: `allow_anonymous true` ist für ein abgeschottetes
# Heimnetz gedacht. Wer den Port 1883 über das LAN hinaus exponiert, sollte
# auf `allow_anonymous false` + `password_file` umstellen und die Zugangs-
# daten in config.yaml (climate_sensors.username/password via ${ENV:...})
# hinterlegen.
# ============================================================================

# Standard-MQTT-Port, lauscht auf allen Interfaces des Containers
listener 1883

# Kein Login nötig — bewusste Entscheidung fürs lokale Homelab (siehe oben)
allow_anonymous true

# Persistenz AUS: Klimadaten sind ein flüchtiger Live-Stream; Somnoscope
# puffert sie selbst (iot/climate_buffer.py) und persistiert die Mittelwerte
# im SleepReport (SQLite). Ein Broker-Backlog brächte nur veraltete Messwerte.
persistence false

# Logs nach stdout, damit `docker compose logs mosquitto` sie anzeigt
log_dest stdout
