# ============================================================================
# Grafana Dashboard-Provisioning — lädt JSON-Dashboards aus dem Ordner
# /var/lib/grafana/dashboards (gemountet aus ./docker/grafana/dashboards).
# ============================================================================

apiVersion: 1

providers:
  - name: somnoscope
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
